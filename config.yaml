# Configuración del Radar Regulatorio — Fase 1 (MVP: solo BORA)
# Ver PROYECTO.md sección 2 y MAPA-MAESTRO-AAPP.md sección 8 (banco de keywords).

bora:
  base_url: "https://www.boletinoficial.gob.ar"
  seccion: "primera"
  # Fallback opcional si el acceso directo desde el runner de Actions queda
  # bloqueado por el WAF del sitio (ver src/fuentes/http.py para el
  # diagnóstico y scripts/proxy-bora-cloudflare-worker.js para desplegar un
  # relay propio gratis en Cloudflare Workers). "{url}" se reemplaza por la
  # URL original, URL-encodeada. Vacío = sin fallback (comportamiento actual).
  proxy_url_template: ""
  # Rubros del sumario donde el campo "item" es el TÍTULO/extracto de la norma
  # (porque solo el PEN emite decretos, no hace falta rotular emisor).
  # En el resto de los rubros, "item" es el ORGANISMO emisor.
  rubros_titulo_directo:
    - "DECRETOS"
  # Rubros a relevar. El resto (avisos oficiales, concursos, convenciones
  # colectivas de trabajo) no son normativa sustantiva del sector.
  rubros_relevados:
    - "DECRETOS"
    - "RESOLUCIONES"
    - "RESOLUCIONES GENERALES"
    - "RESOLUCIONES SINTETIZADAS"
    - "DISPOSICIONES"

  # Emisores a filtrar (coinciden por substring, sin acentos, contra el campo
  # "organismo" que expone el sumario). No incluye "Ministerio de Economía" en
  # forma genérica porque ahí cuelgan secretarías sin relación con el sector
  # (agricultura, aduana, etc.) — ver emisores_exactos para ese caso.
  emisores:
    - "SECRETARIA DE ENERGIA"
    - "SUBSECRETARIA DE HIDROCARBUROS"
    - "SUBSECRETARIA DE COMBUSTIBLES"
    - "ENTE NACIONAL REGULADOR DEL GAS"
    - "ENARGAS"
    - "AGENCIA NACIONAL DE PUERTOS Y VIAS NAVEGABLES"
    - "PUERTOS Y VIAS NAVEGABLES"

  # Emisores que solo cuentan si el organismo del ítem coincide EXACTO
  # (evita capturar cualquier secretaría que cuelgue del Ministerio).
  emisores_exactos:
    - "MINISTERIO DE ECONOMIA"

# Keywords del sector (banco curado en MAPA-MAESTRO-AAPP.md sección 8).
