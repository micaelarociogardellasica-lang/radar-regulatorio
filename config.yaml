# Noticias — Google News RSS (ver PROYECTO.md sección 2).
noticias:
  queries:
    - "YPF"
    - "Vaca Muerta"
    - "Secretaría de Energía"
    - "marina mercante cabotaje"
  idioma: "es-419"
  region: "AR"
  # Solo noticias publicadas dentro de esta ventana, para no reprocesar
  # la misma nota en corridas sucesivas.
  ventana_dias: 2
  max_items_por_query: 6

analisis:
  modelo: "claude-sonnet-4-6"
  max_tokens: 1500
  limite_items_por_corrida: 50

salida:
  data_dir: "data"
  docs_dir: "docs"
  templates_dir: "templates"

# Atlas — proyecto hermano (mapa de players de la industria, repo aparte,
# ver "ATLAS-SPEC (1).md"). Vacío = la card del dashboard se muestra en
# estado "Próximamente" sin link activo.
atlas_url: ""
